<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}YouTube Content Creator{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; color: #1f2937; background: #f8fafc; }
        nav { background: #111827; padding: 1rem; }
        nav a { color: white; margin-right: 1rem; text-decoration: none; }
        main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: .5rem; padding: 1rem; margin: 1rem 0; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #e0f2fe; border-radius: .25rem; padding: .75rem; margin: .5rem 0; }
        form.inline { display: inline-block; margin-right: .5rem; }
        button, .button { background: #2563eb; border: 0; border-radius: .25rem; color: white; cursor: pointer; display: inline-block; padding: .55rem .8rem; text-decoration: none; }
        button.danger { background: #b91c1c; }
        input, textarea { box-sizing: border-box; display: block; margin: .25rem 0 1rem; max-width: 100%; padding: .5rem; width: 32rem; }
        .muted { color: #64748b; }
        .chunk { border-top: 1px solid #e5e7eb; padding: .75rem 0; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'project_list' %}">Projects</a>
    <a href="{% url 'source_video_list' %}">Saved transcripts</a>
</nav>
<main>
    {% if messages %}
        <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
