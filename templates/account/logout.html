{% extends "scraper/base.html" %}
{% block title %}Sign out · Creator Studio{% endblock %}
{% block content %}
<div class="card auth-card"><h1>Sign out</h1><p>Sign out of your Creator Studio account?</p>
<form method="post" action="{% url 'account_logout' %}">{% csrf_token %}{% if redirect_field_value %}<input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">{% endif %}<button type="submit">Sign out</button></form>
<p><a href="{% url 'dashboard' %}">Return to dashboard</a></p></div>
{% endblock %}
